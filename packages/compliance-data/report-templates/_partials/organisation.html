<h2>Organisation</h2>
<dl class="facts">
  <dt>Name</dt>
  <dd>{{ organisation.name }}</dd>
  <dt>Legal name</dt>
  <dd>{{ organisation.legalName }}</dd>
  <dt>SEBI registration number</dt>
  <dd>{{ organisation.sebiRegistrationNo }}</dd>
  <dt>Entity type</dt>
  <dd>{{ organisation.entityType }}</dd>
  <dt>Reports to</dt>
  <dd>{{ organisation.reportingAuthority }}</dd>
</dl>
