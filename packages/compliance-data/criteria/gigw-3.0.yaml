# GIGW 3.0 — PLACEHOLDER CONTENT, PENDING EXPERT REVIEW.
#
# These entries are working placeholders written from public summaries, not from the
# official GIGW 3.0 text. Wording, numbering and mappings MUST be checked against the
# official document by an IAAP-certified reviewer before they are relied on (spec §2, §23).
# Every screen and report that shows them says "Pending expert review".
#
# relatedStandard: the requirement is met when that whole standard is met.
# relatedCriteria / relatedRules: WCAG criteria and scanner rules that provide evidence.

standard: gigw3
title: GIGW 3.0 (Guidelines for Indian Government Websites and Apps)
review: pending_expert_review
reviewNote: >-
  Placeholder requirements written from public summaries of GIGW 3.0. Requirement wording,
  numbering and mappings must be confirmed against the official GIGW 3.0 document by an
  IAAP-certified reviewer.

requirements:
  - id: gigw3-wcag
    clause: To be confirmed
    title: Websites and apps conform to WCAG 2.1 Level AA
    summary: GIGW 3.0 adopts WCAG 2.1 Level AA as its accessibility baseline.
    relatedStandard: wcag21aa
    automatable: partial
    steps:
      - Complete the WCAG 2.1 AA manual tests for this property.
      - Confirm the conformance matrix shows no "Does not support" results.

  - id: gigw3-accessibility-statement
    clause: To be confirmed
    title: An accessibility statement is published and linked from every page
    summary: >-
      The site publishes an accessibility statement (commitment, standards, known limitations,
      contact for feedback) linked from a consistent place such as the footer.
    relatedRules: [cr-accessibility-statement]
    automatable: partial
    steps:
      - Find the accessibility statement link on the home page and two inner pages.
      - Check the statement names the standard, known limitations and a feedback contact.
      - Check the statement is dated and was reviewed in the last 12 months.

  - id: gigw3-skip-link
    clause: To be confirmed
    title: A "Skip to main content" link is provided
    summary: >-
      Pages with repeated navigation start with a working "Skip to main content" link.
    relatedCriteria: ["2.4.1"]
    relatedRules: [cr-skip-link]
    automatable: partial
    steps:
      - Load a page and press Tab once; the first stop should be "Skip to main content".
      - Activate it and check focus moves past the navigation to the main content.

  - id: gigw3-languages
    clause: To be confirmed
    title: Content in Indian languages is marked up with the correct language
    summary: >-
      Hindi and regional-language content uses the correct lang attribute, and language
      versions of pages are equivalent.
    relatedCriteria: ["3.1.1", "3.1.2"]
    relatedRules: [cr-lang-regional]
    automatable: partial
    steps:
      - Open each language version of the home page and check the page language is set.
      - Check passages in another language are marked with their own lang attribute.
      - Check the language versions offer the same information and services.

  - id: gigw3-documents
    clause: To be confirmed
    title: Downloadable documents are accessible
    summary: >-
      PDFs and other documents (circulars, disclosures, forms, statements) are tagged and
      accessible, or an accessible alternative is offered.
    relatedRules: [cr-pdf-links]
    automatable: partial
    steps:
      - List the documents linked from the site (the scanner's "PDF links" finding helps).
      - Check a sample opens with a title, reading order, headings and table structure.
      - Check scanned-image PDFs have a text alternative.

  - id: gigw3-captcha
    clause: To be confirmed
    title: CAPTCHA has an accessible alternative
    summary: Any CAPTCHA offers an alternative, such as audio or a different verification method.
    relatedCriteria: ["1.1.1", "3.3.8"]
    relatedRules: [cr-captcha-alternative]
    automatable: partial
    steps:
      - Find every CAPTCHA (sign-in, registration, contact and grievance forms).
      - Complete each one with a screen reader and with the keyboard only.

  - id: gigw3-feedback
    clause: To be confirmed
    title: Users can report accessibility problems and get a response
    summary: >-
      A feedback or grievance mechanism for accessibility problems is available and
      monitored, with a stated response time.
    automatable: none
    steps:
      - Find the accessibility feedback or grievance option from the home page.
      - Submit a test report and confirm it is acknowledged and tracked.
