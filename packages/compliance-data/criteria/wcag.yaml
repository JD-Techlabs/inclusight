# WCAG success criteria at Level A and AA (spec §8).
# WCAG 2.1 has 50 criteria at A + AA; WCAG 2.2 adds 6 and makes 4.1.1 Parsing obsolete.
# Descriptions are plain-language summaries, not the normative text: the `url` points to
# W3C's "Understanding" document for each criterion.
#
# automatable: full | partial | none — how much automated checks can decide on their own.
# After editing, run `pnpm --filter @app/compliance-data data:build`.

standard: wcag
title: Web Content Accessibility Guidelines (WCAG)
understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/{slug}.html

principles:
  "1": Perceivable
  "2": Operable
  "3": Understandable
  "4": Robust

guidelines:
  "1.1": Text Alternatives
  "1.2": Time-based Media
  "1.3": Adaptable
  "1.4": Distinguishable
  "2.1": Keyboard Accessible
  "2.2": Enough Time
  "2.3": Seizures and Physical Reactions
  "2.4": Navigable
  "2.5": Input Modalities
  "3.1": Readable
  "3.2": Predictable
  "3.3": Input Assistance
  "4.1": Compatible

criteria:
  - id: "1.1.1"
    title: Non-text Content
    level: A
    version: "2.0"
    automatable: partial
    slug: non-text-content
    summary: >-
      Images, icons, charts and other non-text content have a text alternative that serves the
      same purpose. Decorative images are hidden from assistive technology.
    affects: [Screen reader users, People who use text-to-speech]

  - id: "1.2.1"
    title: Audio-only and Video-only (Prerecorded)
    level: A
    version: "2.0"
    automatable: none
    slug: audio-only-and-video-only-prerecorded
    summary: >-
      Recorded audio-only content (such as a podcast) has a transcript. Recorded video without
      sound has a transcript or an audio track that describes it.
    affects: [Deaf and hard-of-hearing people, Blind people]

  - id: "1.2.2"
    title: Captions (Prerecorded)
    level: A
    version: "2.0"
    automatable: partial
    slug: captions-prerecorded
    summary: Recorded videos with sound have accurate, synchronised captions.
    affects: [Deaf and hard-of-hearing people]

  - id: "1.2.3"
    title: Audio Description or Media Alternative (Prerecorded)
    level: A
    version: "2.0"
    automatable: none
    slug: audio-description-or-media-alternative-prerecorded
    summary: >-
      Recorded videos have audio description, or a full text alternative that includes the
      important visual information.
    affects: [Blind and low-vision people]

  - id: "1.2.4"
    title: Captions (Live)
    level: AA
    version: "2.0"
    automatable: none
    slug: captions-live
    summary: >-
      Live video with sound (for example webinars or AGM live streams) has real-time captions.
    affects: [Deaf and hard-of-hearing people]

  - id: "1.2.5"
    title: Audio Description (Prerecorded)
    level: AA
    version: "2.0"
    automatable: none
    slug: audio-description-prerecorded
    summary: >-
      Recorded videos have audio description of important visual content that the soundtrack
      does not already convey.
    affects: [Blind and low-vision people]

  - id: "1.3.1"
    title: Info and Relationships
    level: A
    version: "2.0"
    automatable: partial
    slug: info-and-relationships
    summary: >-
      Structure shown visually (headings, lists, tables, form labels, groups of fields) is also
      present in the code, so assistive technology can convey it.
    affects: [Screen reader users]

  - id: "1.3.2"
    title: Meaningful Sequence
    level: A
    version: "2.0"
    automatable: none
    slug: meaningful-sequence
    summary: The reading order in the code matches the meaningful visual order of the content.
    affects: [Screen reader users]

  - id: "1.3.3"
    title: Sensory Characteristics
    level: A
    version: "2.0"
    automatable: none
    slug: sensory-characteristics
    summary: >-
      Instructions do not rely only on shape, colour, size, position or sound (for example
      "press the green button on the right").
    affects: [Blind people, People with colour vision deficiency]

  - id: "1.3.4"
    title: Orientation
    level: AA
    version: "2.1"
    automatable: partial
    slug: orientation
    summary: >-
      Content works in both portrait and landscape orientation unless one orientation is
      essential.
    affects: [People whose device is mounted in a fixed orientation, such as on a wheelchair]

  - id: "1.3.5"
    title: Identify Input Purpose
    level: AA
    version: "2.1"
    automatable: partial
    slug: identify-input-purpose
    summary: >-
      Fields that collect the user's own details (name, email, phone, address) use the correct
      autocomplete values, so browsers can fill them in.
    affects: [People with cognitive disabilities, People with motor disabilities]

  - id: "1.4.1"
    title: Use of Color
    level: A
    version: "2.0"
    automatable: partial
    slug: use-of-color
    summary: >-
      Colour is not the only way information is shown (for example errors, required fields,
      gains and losses, chart series, links within text).
    affects: [People with colour vision deficiency, People with low vision]

  - id: "1.4.2"
    title: Audio Control
    level: A
    version: "2.0"
    automatable: partial
    slug: audio-control
    summary: >-
      Audio that plays automatically for more than 3 seconds can be paused or stopped, or its
      volume changed separately from the system volume.
    affects: [Screen reader users]

  - id: "1.4.3"
    title: Contrast (Minimum)
    level: AA
    version: "2.0"
    automatable: partial
    slug: contrast-minimum
    summary: >-
      Text has a contrast ratio of at least 4.5:1 against its background, or 3:1 for large
      text.
    affects: [People with low vision, Older people, Anyone using a screen in bright light]

  - id: "1.4.4"
    title: Resize Text
    level: AA
    version: "2.0"
    automatable: partial
    slug: resize-text
    summary: Text can be enlarged to 200% without losing content or functionality.
    affects: [People with low vision]

  - id: "1.4.5"
    title: Images of Text
    level: AA
    version: "2.0"
    automatable: none
    slug: images-of-text
    summary: >-
      Text is shown as real text, not as an image of text, except for logos or where the
      presentation is essential.
    affects: [People with low vision, People who change fonts or colours to read]

  - id: "1.4.10"
    title: Reflow
    level: AA
    version: "2.1"
    automatable: none
    slug: reflow
    summary: >-
      Content fits a screen 320 CSS pixels wide (equivalent to 400% zoom) without scrolling in
      two directions, except content such as data tables, maps and charts.
    affects: [People with low vision who zoom, Mobile users]

  - id: "1.4.11"
    title: Non-text Contrast
    level: AA
    version: "2.1"
    automatable: none
    slug: non-text-contrast
    summary: >-
      Form field borders, icons, focus indicators and the meaningful parts of charts have a
      contrast ratio of at least 3:1 against adjacent colours.
    affects: [People with low vision]

  - id: "1.4.12"
    title: Text Spacing
    level: AA
    version: "2.1"
    automatable: partial
    slug: text-spacing
    summary: >-
      No content or functionality is lost when users increase line, paragraph, letter and word
      spacing.
    affects: [People with dyslexia, People with low vision]

  - id: "1.4.13"
    title: Content on Hover or Focus
    level: AA
    version: "2.1"
    automatable: none
    slug: content-on-hover-or-focus
    summary: >-
      Tooltips and pop-ups that appear on hover or focus can be dismissed without moving focus,
      can themselves be hovered, and stay visible until dismissed.
    affects: [People who use screen magnifiers, People with cognitive disabilities]

  - id: "2.1.1"
    title: Keyboard
    level: A
    version: "2.0"
    automatable: partial
    slug: keyboard
    summary: Everything can be operated with a keyboard alone.
    affects: [Blind people, People with motor disabilities, Keyboard users]

  - id: "2.1.2"
    title: No Keyboard Trap
    level: A
    version: "2.0"
    automatable: none
    slug: no-keyboard-trap
    summary: Keyboard focus can always be moved away from any component using the keyboard.
    affects: [Keyboard users, Screen reader users]

  - id: "2.1.4"
    title: Character Key Shortcuts
    level: A
    version: "2.1"
    automatable: none
    slug: character-key-shortcuts
    summary: >-
      Single-key shortcuts can be turned off or remapped, or only work while the component has
      focus.
    affects: [Speech input users, People with motor disabilities]

  - id: "2.2.1"
    title: Timing Adjustable
    level: A
    version: "2.0"
    automatable: partial
    slug: timing-adjustable
    summary: >-
      Users are warned before a time limit (such as a session timeout) expires and can extend
      it, unless the limit is essential or longer than 20 hours.
    affects:
      [People with motor disabilities, People with cognitive disabilities, Screen reader users]

  - id: "2.2.2"
    title: Pause, Stop, Hide
    level: A
    version: "2.0"
    automatable: partial
    slug: pause-stop-hide
    summary: >-
      Moving, blinking, scrolling or auto-updating content (tickers, carousels) that starts
      automatically and lasts more than 5 seconds can be paused, stopped or hidden.
    affects: [People with attention or cognitive disabilities, Screen reader users]

  - id: "2.3.1"
    title: Three Flashes or Below Threshold
    level: A
    version: "2.0"
    automatable: none
    slug: three-flashes-or-below-threshold
    summary: Nothing flashes more than three times in any one second.
    affects: [People with photosensitive epilepsy]

  - id: "2.4.1"
    title: Bypass Blocks
    level: A
    version: "2.0"
    automatable: partial
    slug: bypass-blocks
    summary: >-
      Blocks repeated on every page can be skipped, for example with a "Skip to main content"
      link, headings or landmarks.
    affects: [Keyboard users, Screen reader users]

  - id: "2.4.2"
    title: Page Titled
    level: A
    version: "2.0"
    automatable: partial
    slug: page-titled
    summary: Each page has a title that describes its topic or purpose.
    affects: [Screen reader users, People with cognitive disabilities]

  - id: "2.4.3"
    title: Focus Order
    level: A
    version: "2.0"
    automatable: none
    slug: focus-order
    summary: Keyboard focus moves through the page in an order that preserves meaning and use.
    affects: [Keyboard users, Screen reader users]

  - id: "2.4.4"
    title: Link Purpose (In Context)
    level: A
    version: "2.0"
    automatable: partial
    slug: link-purpose-in-context
    summary: >-
      The purpose of each link can be understood from its text, or from its text together with
      the surrounding sentence, list item or table cell.
    affects: [Screen reader users, People with cognitive disabilities]

  - id: "2.4.5"
    title: Multiple Ways
    level: AA
    version: "2.0"
    automatable: none
    slug: multiple-ways
    summary: >-
      There is more than one way to find a page (for example navigation, search or a site
      map), except for steps in a process.
    affects: [People with cognitive disabilities, Screen reader users]

  - id: "2.4.6"
    title: Headings and Labels
    level: AA
    version: "2.0"
    automatable: none
    slug: headings-and-labels
    summary: Headings and labels describe the topic or purpose of the content they introduce.
    affects: [Screen reader users, People with cognitive disabilities]

  - id: "2.4.7"
    title: Focus Visible
    level: AA
    version: "2.0"
    automatable: partial
    slug: focus-visible
    summary: The element that has keyboard focus has a visible focus indicator.
    affects: [Keyboard users, People with low vision]

  - id: "2.4.11"
    title: Focus Not Obscured (Minimum)
    level: AA
    version: "2.2"
    automatable: none
    slug: focus-not-obscured-minimum
    summary: >-
      An element that receives keyboard focus is not completely hidden by other content, such
      as sticky headers, chat widgets or cookie banners.
    affects: [Keyboard users, People with low vision]

  - id: "2.5.1"
    title: Pointer Gestures
    level: A
    version: "2.1"
    automatable: none
    slug: pointer-gestures
    summary: >-
      Anything done with multi-finger or path-based gestures (pinch, swipe) can also be done
      with a single tap or click.
    affects: [People with motor disabilities]

  - id: "2.5.2"
    title: Pointer Cancellation
    level: A
    version: "2.1"
    automatable: none
    slug: pointer-cancellation
    summary: >-
      Actions happen when the pointer is released, or can be aborted or undone, so accidental
      touches can be cancelled.
    affects: [People with motor disabilities, People with low vision]

  - id: "2.5.3"
    title: Label in Name
    level: A
    version: "2.1"
    automatable: partial
    slug: label-in-name
    summary: >-
      The accessible name of a control contains the text shown on it, so speech-input users can
      say what they see.
    affects: [Speech input users]

  - id: "2.5.4"
    title: Motion Actuation
    level: A
    version: "2.1"
    automatable: none
    slug: motion-actuation
    summary: >-
      Anything triggered by moving the device (shake, tilt) can also be done through the
      interface, and the motion response can be turned off.
    affects: [People with motor disabilities]

  - id: "2.5.7"
    title: Dragging Movements
    level: AA
    version: "2.2"
    automatable: none
    slug: dragging-movements
    summary: >-
      Anything done by dragging (sliders, reordering) can also be done with single taps or
      clicks.
    affects: [People with motor disabilities]

  - id: "2.5.8"
    title: Target Size (Minimum)
    level: AA
    version: "2.2"
    automatable: partial
    slug: target-size-minimum
    summary: >-
      Click and tap targets are at least 24 by 24 CSS pixels or have enough space around them,
      with exceptions such as links inside sentences.
    affects: [People with motor disabilities, People with tremors, Touchscreen users]

  - id: "3.1.1"
    title: Language of Page
    level: A
    version: "2.0"
    automatable: partial
    slug: language-of-page
    summary: The main language of each page is set in the code (for example lang="en" or lang="hi").
    affects: [Screen reader users]

  - id: "3.1.2"
    title: Language of Parts
    level: AA
    version: "2.0"
    automatable: partial
    slug: language-of-parts
    summary: >-
      Passages in another language (such as Hindi or regional-language text on an English
      page) are marked with their own lang attribute so they are pronounced correctly.
    affects: [Screen reader users]

  - id: "3.2.1"
    title: On Focus
    level: A
    version: "2.0"
    automatable: none
    slug: on-focus
    summary: >-
      Moving focus to a component does not by itself cause an unexpected change, such as
      submitting a form or opening a new window.
    affects: [Keyboard users, Screen reader users, People with cognitive disabilities]

  - id: "3.2.2"
    title: On Input
    level: A
    version: "2.0"
    automatable: none
    slug: on-input
    summary: >-
      Changing a setting (choosing an option, ticking a box) does not cause an unexpected
      change of context unless users were told beforehand.
    affects: [Screen reader users, People with cognitive disabilities]

  - id: "3.2.3"
    title: Consistent Navigation
    level: AA
    version: "2.0"
    automatable: none
    slug: consistent-navigation
    summary: Navigation repeated across pages appears in the same relative order each time.
    affects: [People with cognitive disabilities, People who use screen magnifiers]

  - id: "3.2.4"
    title: Consistent Identification
    level: AA
    version: "2.0"
    automatable: none
    slug: consistent-identification
    summary: >-
      Components that do the same thing are identified the same way across the site (same
      labels and icons).
    affects: [People with cognitive disabilities, Screen reader users]

  - id: "3.2.6"
    title: Consistent Help
    level: A
    version: "2.2"
    automatable: none
    slug: consistent-help
    summary: >-
      Help options repeated on several pages (contact details, chat, FAQ, grievance link) are
      in the same relative place on each page.
    affects: [People with cognitive disabilities]

  - id: "3.3.1"
    title: Error Identification
    level: A
    version: "2.0"
    automatable: none
    slug: error-identification
    summary: >-
      When an input error is detected, the field in error is identified and the error is
      described in text.
    affects:
      [
        Screen reader users,
        People with cognitive disabilities,
        People with colour vision deficiency,
      ]

  - id: "3.3.2"
    title: Labels or Instructions
    level: A
    version: "2.0"
    automatable: partial
    slug: labels-or-instructions
    summary: >-
      Form fields have labels or instructions, including any required format (for example
      date of birth or PAN format).
    affects: [Screen reader users, People with cognitive disabilities]

  - id: "3.3.3"
    title: Error Suggestion
    level: AA
    version: "2.0"
    automatable: none
    slug: error-suggestion
    summary: >-
      When an input error is detected and a correction is known, the suggestion is shown,
      unless that would compromise security.
    affects: [People with cognitive disabilities, Screen reader users]

  - id: "3.3.4"
    title: Error Prevention (Legal, Financial, Data)
    level: AA
    version: "2.0"
    automatable: none
    slug: error-prevention-legal-financial-data
    summary: >-
      For financial transactions, legal commitments and data changes (orders, fund transfers,
      KYC submissions), submissions can be reversed, are checked for errors, or can be reviewed
      and confirmed first.
    affects: [People with cognitive disabilities, People with motor disabilities, Everyone]

  - id: "3.3.7"
    title: Redundant Entry
    level: A
    version: "2.2"
    automatable: none
    slug: redundant-entry
    summary: >-
      Information already entered in the same process is filled in automatically or offered
      for selection instead of being asked for again.
    affects: [People with cognitive disabilities, People with motor disabilities]

  - id: "3.3.8"
    title: Accessible Authentication (Minimum)
    level: AA
    version: "2.2"
    automatable: none
    slug: accessible-authentication-minimum
    summary: >-
      Signing in does not require a cognitive test (remembering a password, solving a puzzle or
      CAPTCHA) unless there is an alternative or help, such as allowing password managers and
      paste.
    affects: [People with cognitive disabilities, People with memory impairments]

  - id: "4.1.1"
    title: Parsing
    level: A
    version: "2.0"
    obsoleteIn: "2.2"
    automatable: full
    slug: parsing
    summary: >-
      Obsolete in WCAG 2.2, which treats it as always satisfied for HTML content. Kept so WCAG
      2.1 reports are complete.
    affects: []

  - id: "4.1.2"
    title: Name, Role, Value
    level: A
    version: "2.0"
    automatable: partial
    slug: name-role-value
    summary: >-
      Every control (buttons, links, form fields, custom widgets) has an accessible name and
      role, and its state and value are exposed to assistive technology.
    affects: [Screen reader users, Speech input users]

  - id: "4.1.3"
    title: Status Messages
    level: AA
    version: "2.1"
    automatable: none
    slug: status-messages
    summary: >-
      Status messages (such as "Order placed", search result counts or errors) are announced by
      assistive technology without moving focus.
    affects: [Screen reader users]
