# Rule → criteria mapping (spec §8). Every axe-core rule and every A11yComply custom rule is
# listed here; scans store an issue's criteria from this file, not from code.
#
# kind:
#   violation      a failure of the listed WCAG criteria; counted in scores
#   best_practice  related to the listed criteria but not a failure on its own; not scored
#   review         a finding a person must check (the scanner cannot decide); not scored
#   aaa            Level AAA rule; not run (SEBI requires Level AA)
# criteria: WCAG success criteria. A rule with no WCAG criteria must be referenced by a GIGW or
# IS 17802 requirement (relatedRules) instead.
#
# The axe section was generated from axe-core's own WCAG tags (plus hand-mapped best-practice
# rules) and is checked against the installed axe-core version by a unit test, so an axe
# upgrade that adds rules fails until they are mapped here.

